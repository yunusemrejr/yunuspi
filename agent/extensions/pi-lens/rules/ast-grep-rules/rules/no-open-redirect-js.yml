id: no-open-redirect-js
language: JavaScript
message: "Review redirect target validation; a redirect call alone does not prove an open redirect"
severity: warning
note: |
  Redirecting to user-supplied URLs without validation can enable phishing
  attacks. Validate that redirect targets are internal paths or trusted domains.
rule:
  any:
    - pattern: window.location = $URL
    - pattern: window.location.href = $URL
    - pattern: window.open($URL, $$$)
    - pattern: location.href = $URL
    - pattern: res.redirect($URL)
    - pattern: response.redirect($URL)

# Syntax-only review: safe literal internal paths cannot select another origin.
# Other targets remain advisories; this matcher does not prove taint or missing validation.
constraints:
  URL:
    not:
      all:
        - kind: string
        - regex: ^['"]/([A-Za-z0-9][A-Za-z0-9/_-]*)?['"]$
