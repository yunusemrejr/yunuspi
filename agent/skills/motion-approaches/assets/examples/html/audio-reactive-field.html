<!doctype html>
<meta charset="utf-8">
<title>Audio-reactive visuals from a precomputed envelope</title>
<!--
APPROACH  vanilla Canvas 2D driven by data measured from the real audio (extract-envelope.py), never by a live analyser
CONCEPTS  1) offline analysis: band energies and spectral-flux onsets are measured once at 60 Hz and shipped as JSON, so the
             picture is a function of absolute time and renders identically on every machine and at any frame rate
          2) stateless smoothing: attack/release is evaluated by replaying the last half second of samples inside renderFrame,
             so seeking to any frame gives the same value as playing up to it
          3) separate what should react: onsets spawn expanding rings (events), bands set bar height (levels), the kick sets scale
          4) quiet passages are designed too: a resting shape remains legible when the envelope is near zero
USE       python3 extract-envelope.py music.wav > envelope.json ; props.envelope = that object ; props.theme for colours
          Without props.envelope a clearly labelled SYNTHETIC envelope plays so the page can be reviewed on its own.
-->
<style> html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f14; } body.transparent { background: transparent; } canvas { position: absolute; inset: 0; width: 100%; height: 100%; } #tag { position: absolute; left: 3vw; bottom: 3vh; font: 600 1.7vh/1 ui-monospace, monospace; letter-spacing: .12em; color: #8d95a6; } </style>
<body><canvas id="c"></canvas><div id="tag"></div>
<script>
const P = Object.assign({ duration: 8, transparent: false, theme: {}, fonts: {}, text: {} }, window.__PROPS__ ?? JSON.parse(new URLSearchParams(location.search).get("props") || "{}"));
const T = Object.assign({ background: "#0d0f14", ink: "#eef0f6", muted: "#8d95a6", accent: "#ffcf4a", accent2: "#4ad6c1" }, P.theme);
if (P.transparent) document.body.classList.add("transparent"); else document.body.style.background = T.background;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), W = canvas.width = innerWidth, H = canvas.height = innerHeight;
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }, A = rgb(T.accent), B = rgb(T.accent2);
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// ---- data: five bands + onset at `fps` samples per second -------------------------------------------------------
let env = P.envelope;
if (!env) {                                           // synthetic stand-in: 100 bpm kick/hat grid with a slow swell
  const fps = 60, n = Math.ceil(P.duration * fps), beat = 60 / 100;
  const at = (i, k) => { const t = i / fps, ph = (t % beat) / beat; return [Math.exp(-ph * 6) * (0.6 + 0.4 * Math.sin(t * 0.8)), Math.exp(-ph * 4) * 0.7, 0.35 + 0.25 * Math.sin(t * 3.1 + k), 0.3 + 0.3 * Math.sin(t * 5.3), (Math.floor(t / (beat / 2)) % 2 ? 0.8 : 0.1) * Math.exp(-((t % (beat / 2)) / (beat / 2)) * 5)][k]; };
  env = { fps, bands: [0, 1, 2, 3, 4].map(k => Array.from({ length: n }, (_, i) => at(i, k))), onset: Array.from({ length: n }, (_, i) => ((i / fps) % beat) < 1 / fps ? 1 : 0), synthetic: true };
  document.getElementById("tag").textContent = "SYNTHETIC ENVELOPE - pass props.envelope from extract-envelope.py";
}
const FPS = env.fps, N = env.bands[0].length;
const raw = (band, i) => env.bands[band][clamp(i, 0, N - 1) | 0] ?? 0;
function level(band, t) {                              // causal attack/release over the previous 0.5 s, replayed statelessly
  const attack = 1 - Math.exp(-1 / (0.025 * FPS)), release = 1 - Math.exp(-1 / (0.2 * FPS)), end = Math.floor(t * FPS);
  let v = 0; for (let i = Math.max(0, end - Math.round(0.5 * FPS)); i <= end; i++) { const x = raw(band, i); v += (x > v ? attack : release) * (x - v); } return v;
}
const onsets = []; for (let i = 1; i < N; i++) if (env.onset[i] > 0.5 && env.onset[i - 1] <= 0.5 && (!onsets.length || i / FPS - onsets.at(-1) > 0.12)) onsets.push(i / FPS);

window.renderFrame = async t => {
  ctx.clearRect(0, 0, W, H); if (!P.transparent) { ctx.fillStyle = T.background; ctx.fillRect(0, 0, W, H); }
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.24, bands = [0, 1, 2, 3, 4].map(b => level(b, t));
  const kick = bands[0] * 0.7 + bands[1] * 0.3;
  // events: each onset spawns a ring that expands and fades, a pure function of (t - onset time)
  for (const o of onsets) { const age = t - o; if (age < 0 || age > 1.3) continue; const k = age / 1.3, r = R * (1.1 + 2.4 * (1 - (1 - k) ** 3));
    ctx.strokeStyle = `rgba(${B},${0.55 * (1 - k) ** 2})`; ctx.lineWidth = Math.max(1, H * 0.004 * (1 - k)); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke(); }
  // levels: 120 bars around the circle; the five bands are interpolated smoothly around it and mirrored left-right
  const BAR = 120;
  for (let i = 0; i < BAR; i++) {
    const a = i / BAR * Math.PI * 2 - Math.PI / 2, m = Math.abs(((i / BAR) * 2) % 2 - 1) * 4, lo = Math.floor(m), f = m - lo, v = lerp(bands[Math.min(4, lo)], bands[Math.min(4, lo + 1)], f * f * (3 - 2 * f));
    const rest = 0.025, len = H * (rest + 0.2 * v ** 0.8), r0 = R * (1 + 0.12 * kick), mix = clamp(v * 1.4);
    ctx.strokeStyle = `rgb(${lerp(A[0], B[0], mix) | 0},${lerp(A[1], B[1], mix) | 0},${lerp(A[2], B[2], mix) | 0})`; ctx.lineWidth = Math.max(2, W * 0.0042); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.stroke();
  }
  ctx.strokeStyle = T.ink; ctx.lineWidth = Math.max(2, W * 0.003); ctx.beginPath(); ctx.arc(cx, cy, R * (0.78 + 0.12 * kick), 0, 7); ctx.stroke();   // the kick scales the ring
  ctx.fillStyle = `rgb(${A})`; ctx.beginPath(); ctx.arc(cx, cy, R * 0.06 * (1 + 2.4 * kick), 0, 7); ctx.fill();
};
</script>
