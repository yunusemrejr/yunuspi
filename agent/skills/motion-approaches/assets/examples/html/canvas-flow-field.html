<!doctype html>
<meta charset="utf-8">
<title>Curl-noise flow field, frame-pure</title>
<!--
APPROACH  vanilla Canvas 2D; a flow of ribbons that is a function of t alone (no particle state, so seeking and re-rendering are exact)
CONCEPTS  1) divergence-free motion: velocity is the curl of a scalar noise potential, so the flow swirls and never piles up
          2) frame purity without simulation: each ribbon is re-integrated from its fixed seed point through the field at time t,
             and only a moving window of the path is drawn
          3) value noise built from an integer hash (identical on every machine and frame), 3D: x, y and time
          4) tone-aware blending: additive light on dark grounds, multiplied ink on light grounds
USE       props.theme (background, accent, accent2); props.density (0.3-2); duration defaults to 8s and loops cleanly
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1410; }
  body.transparent { background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<body><canvas id="c"></canvas>
<script>
const P = Object.assign({ duration: 8, transparent: false, density: 1, theme: {}, fonts: {}, text: {} }, window.__PROPS__ ?? JSON.parse(new URLSearchParams(location.search).get("props") || "{}"));
const T = Object.assign({ background: "#0b1410", accent: "#9be564", accent2: "#33b5a5", ink: "#e6f2e8" }, P.theme);
if (P.transparent) document.body.classList.add("transparent"); else document.body.style.background = T.background;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const W = canvas.width = innerWidth, H = canvas.height = innerHeight;
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255; };
const dark = lum(T.background) < 0.45;
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const A = rgb(T.accent), B = rgb(T.accent2);

const hash = (x, y, z) => { let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + (b - a) * t;
function noise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi);
  const c = (dx, dy, dz) => hash(xi + dx, yi + dy, zi + dz);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), xf), lerp(c(0, 1, 0), c(1, 1, 0), xf), yf), lerp(lerp(c(0, 0, 1), c(1, 0, 1), xf), lerp(c(0, 1, 1), c(1, 1, 1), xf), yf), zf);
}
// the potential is a sum of two octaves; time wraps so the field (and the whole film) loops at `duration`
const potential = (x, y, tau) => noise(x * 1.7, y * 1.7, tau * 3) + 0.5 * noise(x * 3.9 + 9, y * 3.9 - 4, tau * 6);
function velocity(x, y, tau) { const e = 0.004; return [(potential(x, y + e, tau) - potential(x, y - e, tau)) / (2 * e), -(potential(x + e, y, tau) - potential(x - e, y, tau)) / (2 * e)]; }

const COUNT = Math.round(1100 * P.density), STEPS = 60, TAIL = 22, unit = Math.max(W, H);
const seeds = Array.from({ length: COUNT }, (_, i) => ({ x: hash(i, 1, 7) * 1.1 - 0.05, y: hash(i, 2, 7) * 1.1 - 0.05, phase: hash(i, 3, 7), w: 0.6 + 1.6 * hash(i, 4, 7) ** 2, tone: hash(i, 5, 7) }));

window.renderFrame = async t => {
  const tau = (t % P.duration) / P.duration;                           // 0..1, looping
  ctx.globalCompositeOperation = "source-over"; ctx.clearRect(0, 0, W, H);
  if (!P.transparent) { ctx.fillStyle = T.background; ctx.fillRect(0, 0, W, H); }
  ctx.globalCompositeOperation = dark ? "lighter" : "multiply"; ctx.lineCap = "round";
  const step = 0.0075;
  for (const s of seeds) {
    // integrate the whole ribbon from its seed through the field at time t, then draw the moving window
    const path = []; let x = s.x, y = s.y;
    for (let k = 0; k < STEPS; k++) { path.push(x, y); const [vx, vy] = velocity(x, y, tau); const m = Math.hypot(vx, vy) + 1e-6; x += vx / m * step; y += vy / m * step; }
    const head = Math.floor(((s.phase + tau * 2) % 1) * (STEPS - 1)), from = Math.max(0, head - TAIL);
    const mix = s.tone, r = lerp(A[0], B[0], mix), g = lerp(A[1], B[1], mix), b = lerp(A[2], B[2], mix);
    for (let k = from; k < head; k++) {
      const fadeIn = (k - from) / TAIL, a = (dark ? 0.9 : 0.55) * fadeIn * fadeIn;
      ctx.strokeStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`; ctx.lineWidth = s.w * (unit / 1100) * (0.5 + fadeIn);
      ctx.beginPath(); ctx.moveTo(path[2 * k] * W, path[2 * k + 1] * H); ctx.lineTo(path[2 * k + 2] * W, path[2 * k + 3] * H); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = "source-over";
};
</script>
