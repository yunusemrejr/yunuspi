<!doctype html>
<meta charset="utf-8">
<title>Raymarched signed-distance scene</title>
<!--
APPROACH  sphere-tracing in a fragment shader: no meshes, no libraries; geometry is a distance function
CONCEPTS  1) smooth union (polynomial smin) melts separate spheres into one organic mass as they approach
          2) lighting from the distance field itself: normals by central difference, soft shadows by marching toward the light
             and tracking the narrowest miss, ambient occlusion from a few distance probes along the normal
          3) fresnel rim in the look's second colour separates the form from the ground
          4) composition for video: the subject sits right of centre (props.side) and leaves the left third quiet for a headline
          5) the camera orbits on time, and every moving part is periodic in `duration`, so the clip loops
USE       props.theme (background, accent, accent2, ink); props.scale 0.5-1 trades sharpness for speed in software GL
-->
<style> html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; } canvas { display: block; width: 100%; height: 100%; } </style>
<body><canvas id="c"></canvas>
<script>
const P = Object.assign({ duration: 8, transparent: false, scale: 0.75, side: 0.2, theme: {}, fonts: {}, text: {} }, window.__PROPS__ ?? JSON.parse(new URLSearchParams(location.search).get("props") || "{}"));
const T = Object.assign({ background: "#0a1217", accent: "#c6d3da", accent2: "#35e3b0", ink: "#eef6f4" }, P.theme);
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const canvas = document.getElementById("c"); canvas.width = Math.round(innerWidth * P.scale); canvas.height = Math.round(innerHeight * P.scale);
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, alpha: false });
const vert = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const frag = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uPhase; uniform float uSide; uniform vec3 cBg, cA, cB, cInk;
out vec4 o;
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float map(vec3 p) {
  float a = uPhase;
  vec3 c1 = vec3(0.55 * cos(a), 0.2 * sin(2.0 * a), 0.55 * sin(a));
  vec3 c2 = vec3(-0.5 * cos(a + 2.1), 0.25 * sin(a + 1.0), -0.5 * sin(a + 2.1));
  vec3 c3 = vec3(0.35 * sin(a + 4.2), -0.3 * cos(2.0 * a), 0.35 * cos(a + 4.2));
  float d = smin(length(p - c1) - 0.42, length(p - c2) - 0.34, 0.5);
  d = smin(d, length(p - c3) - 0.3, 0.5);
  vec2 q = vec2(length(p.xz) - 1.05, p.y);                           // a ring orbiting the mass: torus distance
  float ring = length(q) - 0.045;
  return min(smin(d, ring, 0.12), p.y + 0.95);                       // ground plane
}
vec3 normal(vec3 p) { vec2 e = vec2(0.0015, 0.0); return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx))); }
float shadow(vec3 ro, vec3 rd) { float res = 1.0, t = 0.04; for (int i = 0; i < 22; i++) { float h = map(ro + rd * t); res = min(res, 9.0 * h / t); t += clamp(h, 0.02, 0.4); if (res < 0.003 || t > 4.0) break; } return clamp(res, 0.0, 1.0); }
float ao(vec3 p, vec3 n) { float s = 0.0, k = 1.0; for (int i = 1; i <= 4; i++) { float h = 0.06 * float(i); s += (h - map(p + n * h)) * k; k *= 0.62; } return clamp(1.0 - 2.4 * s, 0.0, 1.0); }
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y; uv.x -= uSide;  // push the subject right, leave the left quiet
  float a = uPhase * 0.5 + 0.6;
  vec3 ro = vec3(3.9 * sin(a), 0.85, 3.9 * cos(a)), ta = vec3(0.0, -0.05, 0.0);
  vec3 fw = normalize(ta - ro), rt = normalize(cross(fw, vec3(0, 1, 0))), up = cross(rt, fw), rd = normalize(uv.x * rt + uv.y * up + 1.9 * fw);
  vec3 bg = mix(cBg * 0.65, cBg * 1.25, smoothstep(-0.6, 0.7, uv.y + 0.1));
  vec3 col = bg; float t = 0.0; bool hit = false;
  for (int i = 0; i < 60; i++) { float d = map(ro + rd * t); if (d < 0.0008) { hit = true; break; } t += d; if (t > 9.0) break; }
  if (hit) {
    vec3 p = ro + rd * t, n = normal(p), l = normalize(vec3(-0.5, 0.8, 0.35));
    bool ground = p.y < -0.94;
    vec3 base = ground ? mix(cBg * 1.1, cBg * 0.8, smoothstep(0.0, 3.0, length(p.xz))) : mix(cA, cInk, 0.08);
    float diff = max(dot(n, l), 0.0) * shadow(p + n * 0.01, l), occ = ao(p, n);
    float fres = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    col = base * (0.18 + 0.95 * diff) * occ + (ground ? vec3(0.0) : cB * fres * 0.9 * occ);
    col += (ground ? 0.0 : 1.0) * pow(max(dot(reflect(-l, n), -rd), 0.0), 40.0) * 0.28 * diff;
    col = mix(col, bg, 1.0 - exp(-0.018 * t * t));                  // distance fog into the background
  }
  col = pow(col, vec3(0.92)); col *= 1.0 - 0.3 * dot(uv, uv);
  o = vec4(col, 1.0);
}`;
function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const program = gl.createProgram(); gl.attachShader(program, compile(gl.VERTEX_SHADER, vert)); gl.attachShader(program, compile(gl.FRAGMENT_SHADER, frag)); gl.linkProgram(program);
gl.useProgram(program); gl.bindVertexArray(gl.createVertexArray()); gl.viewport(0, 0, canvas.width, canvas.height);
const set3 = (name, hex) => gl.uniform3fv(gl.getUniformLocation(program, name), rgb(hex));
set3("cBg", T.background); set3("cA", T.accent); set3("cB", T.accent2); set3("cInk", T.ink);
gl.uniform2f(gl.getUniformLocation(program, "uRes"), canvas.width, canvas.height); gl.uniform1f(gl.getUniformLocation(program, "uSide"), P.side);
const phase = gl.getUniformLocation(program, "uPhase");
window.renderFrame = async t => { gl.uniform1f(phase, (t % P.duration) / P.duration * Math.PI * 2); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.finish(); };
</script>
