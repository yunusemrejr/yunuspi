name: Public safety and distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-public.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install execution isolation prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 apparmor
          sudo apparmor_parser -r config/bwrap.apparmor
      - run: node --test tests/*.test.mjs
        env:
          PI_REQUIRE_ISOLATION_TEST: '1'
