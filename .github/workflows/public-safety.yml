name: Public safety and distribution checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
permissions:
  contents: read
# PR updates supersede their older checks. Recurring/manual runs have separate
# groups, and cannot cancel an exact main commit needed for a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  # Native integrations run for shared/release changes, weekly, or on demand.
  # Release tags still require this exact commit's successful full safety job.
  safety:
    needs: [minimum-node]
    if: ${{ needs.minimum-node.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run build:core
      - id: browser-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.browser-version.outputs.version }}
      - name: Install execution isolation prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap python3 python3-numpy apparmor ffmpeg xvfb xdotool x11-apps x11-utils libfluidsynth3 timgm6mb-soundfont
          sudo apparmor_parser -r config/bwrap.apparmor
      - name: Start disposable sandbox resource manager
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install the pinned browser for real render and media checks
        run: |
          npx --no-install playwright install --with-deps chromium
          sudo apparmor_parser -r config/playwright-chromium.apparmor
      - name: Run the complete test suite
        env:
          PI_REQUIRE_ISOLATION_TEST: '1'
          PI_SANDBOX_REQUIRE: '1'
          PI_REQUIRE_MEDIA_TEST: '1'
          PI_REQUIRE_SOUNDFONT_TEST: '1'
          PI_BROWSER_REQUIRE: '1'
          PI_RENDER_BROWSER_CHANNEL: chromium
        run: node scripts/test.mjs

  # The same small catalogue drives local routine checks and minimum Node CI.
  # New/changed tests are included; setup of native prerequisites stays in safety.
  minimum-node:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PI_LOCAL_LM: 'off'
      PI_PUBLIC_TEST_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: plan
        run: node scripts/test.mjs --quick --base "$CI_BASE_SHA" --plan
      - run: node scripts/check-public.mjs
      - run: node scripts/version-release.mjs "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run build:core
      - run: node agent/scripts/generate-capabilities-doc.mjs --root "$PWD" --check
      - run: node scripts/check-syntax.mjs --changed "$CI_BASE_SHA"
      - name: Run short checks and changed tests on the minimum supported Node
        env:
          FULL_CHECK: ${{ steps.plan.outputs.full }}
        run: |
          if [ "$FULL_CHECK" = true ]; then
            node scripts/test.mjs --quick
          else
            node scripts/test.mjs --quick --base "$CI_BASE_SHA"
          fi
      - run: node agent/scripts/tool-efficiency-bench.mjs
      - run: node agent/scripts/adaptive-execution-bench.mjs
      - run: node agent/scripts/competence-replay-bench.mjs

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-public.mjs
      - run: node scripts/version-release.mjs "$(node -p "require('./package.json').version")"
      - name: Verify the exact main commit passed and publish its version tag
        run: node scripts/publish-github-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
