name: Public safety and distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'
permissions:
  contents: read
# A newer push or PR update supersedes the checks of the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The complete suite as parallel shards balanced by file size, with the native
  # integrations (sandbox, browser, media). Weekly or on demand, never on a push:
  # publishing is a push to main and nothing waits for this.
  shard:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run build:core
      - id: browser-version
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.browser-version.outputs.version }}
      - name: Install execution isolation prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap python3 python3-numpy apparmor ffmpeg xvfb xdotool x11-apps x11-utils libfluidsynth3 timgm6mb-soundfont
          sudo apparmor_parser -r config/bwrap.apparmor
          # Since the ubuntu-latest move to Ubuntu 26 (2026-10-19) the runner confines bwrap's
          # namespace so it cannot write a uid map or bring up loopback; unchanged 0.49.0 went
          # from green to red on it. The sandbox works under the profile above on an Ubuntu
          # 26.04 desktop, so lift the restriction on this disposable runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start disposable sandbox resource manager
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install the pinned browser for real render and media checks
        run: |
          npx --no-install playwright install --with-deps chromium
          sudo apparmor_parser -r config/playwright-chromium.apparmor
      - name: Run this shard of the complete test suite
        env:
          PI_REQUIRE_ISOLATION_TEST: '1'
          PI_SANDBOX_REQUIRE: '1'
          PI_REQUIRE_MEDIA_TEST: '1'
          PI_REQUIRE_SOUNDFONT_TEST: '1'
          PI_BROWSER_REQUIRE: '1'
          PI_RENDER_BROWSER_CHANNEL: chromium
        run: node scripts/test.mjs --shard ${{ matrix.index }}/6

  # Cheap structural checks on the minimum supported Node. A push or PR also runs
  # the short catalogue plus new/changed tests; the shards cover everything on the
  # weekly and manual runs.
  minimum-node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      PI_LOCAL_LM: 'off'
      PI_PUBLIC_TEST_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/check-public.mjs
      - run: node scripts/sync-versions.mjs "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run build:core
      - run: node agent/scripts/generate-capabilities-doc.mjs --root "$PWD" --check
      - run: node scripts/check-syntax.mjs --changed "$CI_BASE_SHA"
      - name: Run short checks and changed tests on the minimum supported Node
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: node scripts/test.mjs --quick --base "$CI_BASE_SHA"
