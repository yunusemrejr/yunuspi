name: Public safety and distribution checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push supersedes older runs on the same branch: cancel them instead of
# queueing full suites behind each other. Main and release tags never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  # Install/build once and let Node schedule the complete suite on this runner.
  # Release tags reuse this exact commit's successful main run below.
  safety:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/check-public.mjs
      - run: node scripts/version-release.mjs "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:core
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install execution isolation prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap python3 python3-numpy apparmor ffmpeg xvfb xdotool x11-apps x11-utils libfluidsynth3 timgm6mb-soundfont
          sudo apparmor_parser -r config/bwrap.apparmor
      - name: Start disposable sandbox resource manager
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install the pinned browser for real render and media checks
        run: |
          npx --no-install playwright install --with-deps chromium
          sudo apparmor_parser -r config/playwright-chromium.apparmor
      - name: Run the complete test suite
        env:
          PI_REQUIRE_ISOLATION_TEST: '1'
          PI_SANDBOX_REQUIRE: '1'
          PI_REQUIRE_MEDIA_TEST: '1'
          PI_REQUIRE_SOUNDFONT_TEST: '1'
          PI_BROWSER_REQUIRE: '1'
          PI_RENDER_BROWSER_CHANNEL: chromium
        run: PI_LOCAL_LM=off node --test --test-concurrency=4 tests/*.test.mjs
      - name: Check concise tool output and required evidence bounds
        env:
          PI_LOCAL_LM: 'off'
        run: node agent/scripts/tool-efficiency-bench.mjs
      - name: Check adaptive scheduling and coordination bounds
        env:
          PI_LOCAL_LM: 'off'
        run: node agent/scripts/adaptive-execution-bench.mjs
      - name: Check competence control calibration
        env:
          PI_LOCAL_LM: 'off'
        run: node agent/scripts/competence-replay-bench.mjs

  # The manifest supports Node >=22.19.0 while the full suite runs on 24. This
  # lane keeps the minimum runtime honest with the deterministic, prerequisite-
  # free core of the suite: build, cancellation, provider admission, memory and review.
  minimum-node:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:core
      - name: Run the deterministic core on the minimum supported Node
        env:
          PI_LOCAL_LM: 'off'
        run: >-
          node --test --test-concurrency=2
          tests/command-dispatch.test.mjs tests/core-robustness.test.mjs tests/preflight-stop-cancellation.test.mjs
          tests/provider-gate.test.mjs tests/provider-health-admission.test.mjs tests/provider-health-stall.test.mjs
          tests/double-runner.test.mjs tests/quality-review.test.mjs tests/scope-deliberation.test.mjs
          tests/project-vector-memory.test.mjs tests/memory-embedding-coverage.test.mjs tests/jev-client.test.mjs
          tests/stream-lifecycle.test.mjs tests/rpc-client-lifecycle.test.mjs tests/guarded-process.test.mjs
          tests/needle-embedding-cache.test.mjs tests/memory-guard.test.mjs

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-public.mjs
      - run: node scripts/version-release.mjs "$(node -p "require('./package.json').version")"
      - name: Verify the exact main commit passed and publish its version tag
        run: node scripts/publish-github-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
